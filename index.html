<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profil Ridho Joewandilnata</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,sans-serif;background:#07111f;color:#fff;line-height:1.7}
nav{position:sticky;top:0;z-index:10;background:#07111fee;border-bottom:1px solid #18324f;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold;color:#58a6ff}
nav a{color:#fff;text-decoration:none;margin:0 8px;font-size:14px}
nav a:hover{color:#58a6ff}
section{max-width:1100px;margin:auto;padding:65px 7%}
.hero{min-height:85vh;display:flex;align-items:center;padding:70px 8%;background:radial-gradient(circle at top right,#12365c,#07111f 58%)}
.badge{display:inline-block;padding:7px 14px;border:1px solid #245b91;border-radius:30px;color:#9ccaff;margin-bottom:18px}
h1{font-size:clamp(40px,7vw,70px);line-height:1.1;margin-bottom:18px}
h1 span{color:#58a6ff}
.hero p{font-size:18px;color:#d2deeb;max-width:800px}
.btn{display:inline-block;margin-top:25px;padding:12px 20px;background:#1976d2;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold}
.title{font-size:34px;margin-bottom:8px}
.sub{color:#aebdce;margin-bottom:30px}
.profile{display:grid;grid-template-columns:210px 1fr;gap:35px;align-items:center}
.avatar{width:200px;height:200px;border-radius:50%;overflow:hidden;border:4px solid #58a6ff}
.avatar img{width:100%;height:100%;object-fit:cover}
.info,.grid,.gallery{display:grid;gap:18px}
.info{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:repeat(2,1fr)}
.gallery{grid-template-columns:repeat(3,1fr)}
.card{background:#0d1b2d;border:1px solid #1b3856;border-radius:18px;padding:22px}
.card h3{color:#69b0ff;margin-bottom:8px}
.card p{color:#d5deea}
.info div{background:#0a1727;border:1px solid #193650;border-radius:12px;padding:12px}
.info b{display:block;color:#69b0ff;font-size:13px}
.gallery-card{background:#0d1b2d;border:1px solid #1b3856;border-radius:16px;overflow:hidden}
.gallery-card img{width:100%;height:210px;object-fit:cover;display:block}
.gallery-card p{padding:12px 15px;font-weight:bold}
footer{text-align:center;padding:30px;background:#050c15;color:#9fb0c3;border-top:1px solid #18324f}
@media(max-width:750px){
nav{flex-direction:column;gap:8px}
nav a{font-size:12px;margin:0 4px}
.hero{min-height:75vh;padding:55px 7%}
section{padding:50px 7%}
.profile{grid-template-columns:1fr;text-align:center}
.avatar{margin:auto}
.info,.grid,.gallery{grid-template-columns:1fr}
.gallery-card img{height:auto}
}
</style>
</head>
